<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>LANShare</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header id="topbar" class="topbar" hidden>
    <h1 id="share-name">LANShare</h1>
    <button id="logout" class="btn btn-quiet">Log out</button>
  </header>

  <main>
    <!-- Login: shown until /api/status reports an authenticated session.
         It doubles as a splash so the first screen says what this is and
         which computer's terminal to look at. -->
    <section id="view-login" class="splash" hidden>
      <div class="splash-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="56" height="56"><rect width="64" height="64" rx="14" fill="var(--accent)"/><path d="M32 12v26M20 28l12 12 12-12M16 50h32" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h2 id="splash-name" class="splash-name">LANShare</h2>
      <p id="splash-host" class="hint"></p>
      <form id="login-form" class="login-form" autocomplete="off">
        <label for="code">Access code</label>
        <!-- inputmode=numeric brings up the number pad on iOS; one-time-code
             keeps Safari from offering saved passwords. -->
        <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code"
               placeholder="482-913" required autofocus>
        <button type="submit" class="btn btn-primary btn-wide">Unlock</button>
        <p id="login-error" class="error" role="alert" hidden></p>
        <p class="hint">The code is on the screen of that computer.</p>
      </form>
    </section>

    <!-- Files: the main view. -->
    <section id="view-files" hidden>
      <section id="upload-panel" class="card" hidden>
        <h2>Send to this computer</h2>
        <!-- A plain file input is what lets iOS offer Photo Library / Files /
             camera. `multiple` so several photos go in one trip. -->
        <label class="btn btn-primary file-picker">
          Choose files…
          <input id="upload-input" type="file" multiple hidden>
        </label>
        <div id="upload-status" hidden>
          <div class="progress"><div id="upload-bar" class="progress-bar"></div></div>
          <p id="upload-text" class="hint"></p>
          <button id="upload-cancel" class="btn btn-quiet">Cancel</button>
        </div>
        <p id="upload-result" class="hint" hidden></p>
      </section>

      <div class="toolbar">
        <p id="file-count" class="hint"></p>
        <div class="toolbar-actions">
          <div class="segmented" role="group" aria-label="View">
            <button id="view-list" class="btn btn-quiet" aria-pressed="true" title="List">List</button>
            <button id="view-grid" class="btn btn-quiet" aria-pressed="false" title="Grid">Grid</button>
          </div>
          <button id="refresh" class="btn btn-quiet" title="Refresh">↻</button>
        </div>
      </div>

      <div class="controls">
        <input id="search" type="search" placeholder="Search" aria-label="Search files" autocomplete="off">
        <select id="sort" aria-label="Sort">
          <option value="name">Name</option>
          <option value="newest">Newest</option>
          <option value="largest">Largest</option>
        </select>
      </div>
      <div id="filters" class="chips" role="group" aria-label="Show">
        <button class="chip" data-filter="all" aria-pressed="true">All</button>
        <button class="chip" data-filter="photos" aria-pressed="false">Photos</button>
        <button class="chip" data-filter="videos" aria-pressed="false">Videos</button>
        <button class="chip" data-filter="other" aria-pressed="false">Other</button>
      </div>

      <p id="files-error" class="error" role="alert" hidden></p>

      <div id="no-match" class="state" hidden>
        <p>No files match.</p>
        <button id="clear-filters" class="btn btn-quiet">Show everything</button>
      </div>

      <div id="loading" class="state" hidden>
        <div class="spinner" aria-hidden="true"></div>
        <p class="hint">Loading…</p>
      </div>
      <div id="empty" class="state" hidden>
        <svg class="state-icon" viewBox="0 0 48 48" width="48" height="48" aria-hidden="true"><path d="M8 14a4 4 0 0 1 4-4h8l4 4h12a4 4 0 0 1 4 4v18a4 4 0 0 1-4 4H12a4 4 0 0 1-4-4z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></svg>
        <p>Nothing shared yet.</p>
        <p class="hint">Files added on the computer show up after a refresh.</p>
      </div>

      <!-- Both views are lists of folder groups; a single group renders
           without its header. -->
      <div id="file-list" class="file-list"></div>
      <div id="file-grid" class="file-grid-view" hidden></div>
    </section>
  </main>

  <!-- Preview overlay: media plays here via the inline endpoint, which
       supports range requests so Safari can seek through large videos. -->
  <div id="preview" class="overlay" hidden>
    <div class="overlay-bar">
      <span id="preview-name" class="overlay-title"></span>
      <a id="preview-download" class="btn btn-primary" download>Download</a>
      <button id="preview-close" class="btn btn-quiet" aria-label="Close">✕</button>
    </div>
    <div id="preview-body" class="overlay-body"></div>
  </div>

  <template id="group-item">
    <section class="group">
      <button class="group-header" aria-expanded="true">
        <span class="group-chevron" aria-hidden="true">▾</span>
        <span class="group-name"></span>
        <span class="group-count hint"></span>
      </button>
      <ul class="group-items"></ul>
    </section>
  </template>

  <template id="file-item">
    <li class="file">
      <div class="file-thumb"></div>
      <div class="file-main">
        <div class="file-name"></div>
        <div class="file-meta"></div>
      </div>
      <div class="file-actions">
        <button class="btn btn-quiet act-preview" hidden>Preview</button>
        <button class="btn btn-quiet act-share" hidden>Share…</button>
        <a class="btn btn-primary act-download" download>Download</a>
      </div>
    </li>
  </template>

  <!-- Grid cells: tap opens the preview (which has Download), or downloads
       directly for files that cannot be previewed. Images show only their
       thumbnail; the name is in the preview. -->
  <template id="grid-item">
    <li class="cell">
      <button class="cell-button">
        <div class="file-thumb cell-thumb"></div>
        <div class="cell-name"></div>
      </button>
    </li>
  </template>

  <footer class="hint">
    Unencrypted HTTP: use only on networks you trust.
  </footer>

  <script src="/app.js"></script>
</body>
</html>
