[package]
name = "lanshare"
version = "0.1.0"
edition = "2024"
description = "Temporary, PIN-protected LAN file sharing from the terminal to any browser"
rust-version = "1.85"

[dependencies]
# CLI parsing. `derive` keeps the argument definitions next to their docs.
clap = { version = "4.5", features = ["derive"] }
# HTTP server + async runtime.
axum = { version = "0.8", features = ["http1", "tokio", "json", "query", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "signal", "io-util", "time", "process", "sync"] }
# Structured logging. Request/response logging comes from tower-http's TraceLayer later.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OS-backed CSPRNG for the PIN and session tokens.
getrandom = "0.4"
# Local wall-clock time for the activity lines in the terminal.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gethostname = "1"
# Constant-time comparison so PIN checks do not leak timing information.
subtle = "2"
qrcode = { version = "0.14", default-features = false }
tower-http = { version = "0.6", features = ["trace", "set-header"] }
# Directory walking without following symlinks, and content types by extension.
walkdir = "2"
mime_guess = "2"
tokio-util = { version = "0.7", features = ["io"] }
# Human-friendly durations for --timeout (30m, 1h30m).
humantime = "2"
futures-core = "0.3"
bytes = "1"
# Thumbnails for common raster formats, decoded in pure Rust. HEIC is handled
# by an external tool at runtime (see transfer/thumbnail.rs).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
percent-encoding = "2"
httpdate = "1"
# Frontend files are compiled into the binary in release builds and read
# from `web/` in debug builds, so UI tweaks need no rebuild while developing.
rust-embed = "8"
# Uploads land in a temp file next to their destination and are renamed into
# place, so a dropped connection never leaves a half-written file behind.
tempfile = "3"
fs4 = "1"
thiserror = "2"

[dev-dependencies]
# Drive the router in-process for integration tests.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Tests generate their own PNG fixtures.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
# Small, fast single binary is the point of shipping this in Rust.
lto = true
codegen-units = 1
strip = true

# Image decoding is painfully slow unoptimised; keep dev builds usable while
# leaving our own crate debuggable.
[profile.dev.package."*"]
opt-level = 2
