[package]
name = "lanshare"
version = "0.1.0"
edition = "2024"
description = "Temporary, PIN-protected LAN file sharing from the terminal to any browser"
license = "MIT"
repository = ""
rust-version = "1.85"

[dependencies]
# CLI parsing. `derive` keeps the argument definitions next to their docs.
clap = { version = "4.5", features = ["derive"] }
# HTTP server + async runtime.
axum = { version = "0.8", features = ["http1", "tokio", "json", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "signal", "io-util", "time"] }
# Structured logging. Request/response logging comes from tower-http's TraceLayer later.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
serde_json = "1"

[profile.release]
# Small, fast single binary is the point of shipping this in Rust.
lto = true
codegen-units = 1
strip = true
